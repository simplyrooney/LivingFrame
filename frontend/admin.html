<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Frame · Admin</title>
<link rel="stylesheet" href="./assets/css/admin.css">
<link rel="stylesheet" href="./assets/css/admin-customer-orders.css">
</head>
<body>
<header class="admin-topbar">
  <div><strong>Living Frame</strong><small>Admin Console</small></div>
  <div class="admin-top-actions"><span id="adminEmail"></span><button id="signOutBtn" class="ghost-btn">Sign out</button></div>
</header>

<main class="admin-shell">
<section id="loginPanel" class="admin-login-card">
  <p class="eyebrow">ADMIN ACCESS</p>
  <h1>Manage Living Frames</h1>
  <form id="loginForm">
    <label>Email<input id="adminLoginEmail" type="email" required></label>
    <label>Password<input id="adminLoginPassword" type="password" required></label>
    <button class="primary-btn full" type="submit">Sign in</button>
    <p id="loginError" class="error"></p>
  </form>
</section>

<section id="dashboard" class="hidden">
  <div class="dashboard-head">
    <div>
      <p class="eyebrow">CUSTOMERS & ORDERS</p>
      <h1>Customer orders</h1>
      <p class="subtle">Customers are grouped once, with every order shown under the same account.</p>
    </div>
    <button id="refreshBtn" class="ghost-btn">Refresh</button>
  </div>

  <div id="summaryCards" class="summary-cards"></div>

  <div class="admin-filters">
    <input id="searchInput" type="search" placeholder="Search customer, order or frame code">
    <select id="paymentFilter">
      <option value="">All payments</option>
      <option value="paid">Paid</option>
      <option value="pending">Pending</option>
      <option value="processing">Processing</option>
      <option value="failed">Failed</option>
    </select>
  </div>

  <div id="adminError" class="error"></div>
  <div id="customersList" class="customer-groups"></div>
</section>
</main>

<script src="./assets/js/admin.js"></script>
</body>
</html>
