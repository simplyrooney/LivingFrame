<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment · Living Frame</title>
<link rel="stylesheet" href="./assets/css/order.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<header class="site-nav shell">
  <a class="brand" href="./">Living Frame</a>
  <span class="checkout-step">Payment</span>
</header>

<main class="center-page shell">
  <div class="payment-card">
    <p class="eyebrow">STEP 3</p>
    <h1 class="checkout-title">Complete your order.</h1>

    <div class="payment-summary">
      <div class="summary-row"><span>Order</span><b id="paymentOrder">—</b></div>
      <div class="summary-row"><span>Customer ID</span><b id="paymentCustomer">—</b></div>
      <div class="summary-row"><span>Frame</span><b id="paymentFrame">—</b></div>
      <div class="summary-row"><span>Size</span><b id="paymentSize">—</b></div>
      <div class="summary-row total-row"><span>Amount</span><b id="paymentAmount">Preparing…</b></div>
    </div>

    <div class="notice">
      <b>Razorpay secure checkout</b><br>
      Payment is created on the server and verified before your Living Frame is sent to the admin fulfilment queue.
    </div>

    <button id="payBtn" class="btn primary full" type="button">Pay securely</button>
    <p id="paymentState" class="muted"></p>
    <p id="paymentError" class="error"></p>
  </div>
</main>

<script src="./assets/js/payment.js"></script>
</body>
</html>
