<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Living Frame · AR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080808;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{overflow:hidden}.app{height:100%;display:grid;grid-template-rows:62px 1fr}
header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:white;background:#111}
.brand{font-weight:850}.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff6b4a;margin-right:7px}
.code{font-size:11px;letter-spacing:.08em;color:#aaa;font-weight:800}
main{position:relative;min-height:0}iframe{width:100%;height:100%;border:0;display:none;background:#050505}
.state{position:absolute;inset:0;display:grid;place-items:center;color:white;text-align:center;padding:24px}
.card{max-width:460px}.card h1{font:42px/1 Georgia,serif;margin:0 0 14px}.card p{color:#aaa;line-height:1.55}
.spinner{width:36px;height:36px;border:3px solid #ffffff22;border-top-color:white;border-radius:50%;margin:0 auto 18px;animation:spin 1s linear infinite}
.actions{display:none;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:999px;padding:12px 16px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}
.primary{background:white;color:#111}.secondary{background:#ffffff10;color:white;border:1px solid #ffffff22}
.hint{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;color:white;background:#111c;border:1px solid #ffffff20;border-radius:999px;padding:9px 13px;font-size:11px;font-weight:800;white-space:nowrap;z-index:5}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><i></i>Living Frame</div><div class="code" id="code">AR VIEWER</div></header>
<main>
<iframe id="ar" title="Living Frame AR" allow="camera; microphone; autoplay; fullscreen; gyroscope; accelerometer; magnetometer; xr-spatial-tracking" allowfullscreen></iframe>
<div class="state" id="state"><div class="card">
<div class="spinner" id="spinner"></div>
<h1 id="title">Opening your memory…</h1>
<p id="message">Preparing the Living Frame AR experience.</p>
<div class="actions" id="actions"><a id="direct" class="btn primary" target="_blank" rel="noopener">Open AR directly</a><button class="btn secondary" onclick="location.reload()">Try again</button></div>
</div></div>
<div class="hint" id="hint">Point your camera at the printed Living Frame</div>
</main>
</div>
<script>
const BACKEND="https://dulcet-melba-2ada13.netlify.app";
const qs=new URLSearchParams(location.search);
const frame=(qs.get("frame")||"").trim().toUpperCase();
const code=document.getElementById("code"), ar=document.getElementById("ar"), state=document.getElementById("state"), spinner=document.getElementById("spinner"), title=document.getElementById("title"), message=document.getElementById("message"), actions=document.getElementById("actions"), direct=document.getElementById("direct"), hint=document.getElementById("hint");
code.textContent=frame||"AR VIEWER";
function fail(t,m,u){spinner.style.display="none";title.textContent=t;message.textContent=m;if(u){direct.href=u;actions.style.display="flex";}}
(async()=>{
 if(!frame){fail("Missing Frame ID","Open this page with ?frame=LF-XXXXXXXX.");return;}
 try{
   const r=await fetch(`${BACKEND}/api/public/frames/${encodeURIComponent(frame)}`);
   const d=await r.json();
   if(!r.ok) throw new Error(d.error||"Living Frame not found");
   if(!d.ar_experience_url){fail("AR experience not published yet","This Living Frame is ready, but its MyWebAR project URL has not been attached yet.");return;}
   direct.href=d.ar_experience_url;
   ar.src=d.ar_experience_url;
   ar.style.display="block";
   state.style.display="none";
   hint.style.display="block";
   let loaded=false;
   ar.addEventListener("load",()=>loaded=true,{once:true});
   setTimeout(()=>{if(!loaded){state.style.display="grid";fail("Open the AR experience","The embedded view did not finish loading. Open it directly instead.",d.ar_experience_url);}},12000);
 }catch(e){fail("Couldn’t open this Living Frame",e.message||"Please try again.");}
})();
</script>
</body>
</html>
